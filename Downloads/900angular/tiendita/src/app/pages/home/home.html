
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f2f2f2;
        }

        header{
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav{
            margin-top: 10px;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .home{
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: white;

            border-radius: 10px;
        }

        .contenido h1{
            font-size: 40px;
            margin-bottom: 15px;
            color: #333;
        }

        .contenido p{
            color: #666;
            margin-bottom: 20px;
        }

        .contenido button{
            padding: 10px 20px;
            border: none;
            background-color: #222;
            color: white;
            border-radius: 5px;
            cursor: pointer;

        .contenido button:hover{

        }
