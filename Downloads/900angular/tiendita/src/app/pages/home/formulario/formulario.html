<style>
  /* Contenedor principal */
  .container {
    margin: 40px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  
  /* Tarjeta del formulario */
  .card {
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08); /* Sombra un poco más suave y amplia */
    overflow: hidden;
    border: 1px solid #e2e8f0;
  }

  /* Encabezado de la tarjeta (Tema Azul Moderno) */
  .card-header {
    background: linear-gradient(135deg, #3b82f6, #2563eb); /* Degradado azul */
    color: white;
    padding: 22px;
    text-align: center;
  }

  .card-header h3 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Cuerpo de la tarjeta */
  .card-body {
    padding: 30px;
  }

  /* Espaciados */
  .mb-3 { margin-bottom: 20px; }
  .mb-4 { margin-bottom: 30px; }
  .mt-1 { margin-top: 5px; }

  /* Etiquetas */
  .form-label {
    display: block;
    margin-bottom: 8px;
    color: #475569; /* Gris oscuro azulado */
    font-size: 15px;
  }
  .fw-bold { font-weight: 600; }

  /* Inputs y Selects */
  .form-control, .form-select {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    color: #334155;
    background-color: #f8fafc; /* Fondo gris súper clarito */
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  /* Efecto al hacer clic en un input */
  .form-control:focus, .form-select:focus {
    outline: none;
    border-color: #3b82f6; /* Borde azul */
    background-color: #ffffff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15); /* Aro de luz azul */
  }

  /* Diseño en columnas para Precio y Stock */
  .row {
    display: flex;
    gap: 20px;
  }
  .col-md-6 {
    flex: 1;
  }

  /* Mensajes de error */
  .text-danger {
    color: #ef4444; /* Rojo moderno */
    font-size: 13px;
    font-weight: 500;
  }

  /* Botón de envío */
  .d-grid {
    display: flex;
    flex-direction: column;
  }

  .btn-submit {
    background-color: #3b82f6; /* Azul primario */
    color: white;
    border: none;
    padding: 16px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
  }

  .btn-submit:hover {
    background-color: #2563eb; /* Azul más oscuro al pasar el mouse */
    transform: translateY(-1px); /* Pequeño efecto de levantamiento */
    box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
  }

  /* Estado deshabilitado del botón */
  .btn-submit:disabled {
    background-color: #93c5fd; /* Azul deslavado */
    color: #eff6ff;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
</style>

<div class="container" style="max-width: 600px;">
  <div class="card">
    <div class="card-header">
      <h3>Agregar Nuevo Producto</h3>
    </div>
    
    <div class="card-body">
      <form [formGroup]="productoForm" (ngSubmit)="guardarProducto()">
        
        <div class="mb-3">
          <label for="nombre" class="form-label fw-bold">Nombre del producto</label>
          <input type="text" id="nombre" class="form-control" formControlName="nombre" placeholder="Ej. Refresco Cola 600ml">
          <div *ngIf="productoForm.get('nombre')?.invalid && productoForm.get('nombre')?.touched" class="text-danger mt-1">
            El nombre es obligatorio y debe tener al menos 3 caracteres.
          </div>
        </div>

        <div class="mb-3">
          <label for="categoria" class="form-label fw-bold">Categoría</label>
          <select id="categoria" class="form-select" formControlName="categoria">
            <option value="">Selecciona una categoría...</option>
            <option value="abarrotes">Abarrotes</option>
            <option value="lacteos">Lácteos y Refrigerados</option>
            <option value="botanas">Botanas y Dulces</option>
            <option value="bebidas">Bebidas</option>
            <option value="limpieza">Limpieza y Hogar</option>
          </select>
          <div *ngIf="productoForm.get('categoria')?.invalid && productoForm.get('categoria')?.touched" class="text-danger mt-1">
            Debes seleccionar una categoría.
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="precio" class="form-label fw-bold">Precio de Venta ($)</label>
            <input type="number" id="precio" class="form-control" formControlName="precio" step="0.50" min="0" placeholder="0.00">
            <div *ngIf="productoForm.get('precio')?.invalid && productoForm.get('precio')?.touched" class="text-danger mt-1">
              Ingresa un precio válido.
            </div>
          </div>

          <div class="col-md-6 mb-3">
            <label for="stock" class="form-label fw-bold">Cantidad en Stock</label>
            <input type="number" id="stock" class="form-control" formControlName="stock" min="0" placeholder="0">
            <div *ngIf="productoForm.get('stock')?.invalid && productoForm.get('stock')?.touched" class="text-danger mt-1">
              Ingresa una cantidad válida.
            </div>
          </div>
        </div>

        <div class="mb-4">
          <label for="codigoBarras" class="form-label fw-bold">Código de Barras</label>
          <input type="text" id="codigoBarras" class="form-control" formControlName="codigoBarras" placeholder="Escanea o escribe el código">
          <div *ngIf="productoForm.get('codigoBarras')?.invalid && productoForm.get('codigoBarras')?.touched" class="text-danger mt-1">
            El código de barras es obligatorio.
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn-submit" [disabled]="productoForm.invalid">
            Guardar Producto
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
