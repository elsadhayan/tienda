<style>
  /* Contenedor principal centrado */
  .container {
    margin: 80px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  
  /* Tarjeta del formulario */
  .card {
    background-color: #ffffff;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    overflow: hidden;
    border: 1px solid #e2e8f0;
  }

  /* Encabezado azul moderno */
  .card-header {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 22px;
    text-align: center;
  }

  .card-header h3 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* Cuerpo de la tarjeta */
  .card-body {
    padding: 35px 30px;
  }

  /* Espaciados */
  .mb-3 { margin-bottom: 20px; }
  .mb-4 { margin-bottom: 30px; }
  .mt-1 { margin-top: 5px; }
  .mt-3 { margin-top: 20px; }

  /* Etiquetas */
  .form-label {
    display: block;
    margin-bottom: 8px;
    color: #475569;
    font-size: 15px;
  }
  .fw-bold { font-weight: 600; }

  /* Inputs con efecto glow azul */
  .form-control {
    width: 100%;
    padding: 12px 15px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 15px;
    color: #334155;
    background-color: #f8fafc;
    box-sizing: border-box;
    transition: all 0.3s ease;
  }

  .form-control:focus {
    outline: none;
    border-color: #3b82f6;
    background-color: #ffffff;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
  }

  /* Mensajes de error */
  .text-danger {
    color: #ef4444;
    font-size: 13px;
    font-weight: 500;
  }

  /* Botón de envío */
  .d-grid {
    display: flex;
    flex-direction: column;
  }

  .btn-submit {
    background-color: #3b82f6;
    color: white;
    border: none;
    padding: 16px;
    border-radius: 8px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px rgba(59, 130, 246, 0.25);
  }

  .btn-submit:hover {
    background-color: #2563eb;
    transform: translateY(-1px);
    box-shadow: 0 6px 12px rgba(59, 130, 246, 0.3);
  }

  .btn-submit:disabled {
    background-color: #93c5fd;
    color: #eff6ff;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  /* Estilos para el texto de abajo */
  .text-center { text-align: center; }
  .text-muted { color: #64748b; font-size: 14px; }
  .link-primary { color: #3b82f6; text-decoration: none; font-weight: 600; transition: color 0.2s; }
  .link-primary:hover { color: #1d4ed8; text-decoration: underline; }
</style>

<div class="container" style="max-width: 450px;">
  <div class="card">
    <div class="card-header">
      <h3>Iniciar Sesión</h3>
    </div>
    
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="iniciarSesion()">
        
        <div class="mb-3">
          <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
          <input type="email" id="correo" class="form-control" formControlName="correo" placeholder="ejemplo@correo.com">
          <div *ngIf="loginForm.get('correo')?.invalid && loginForm.get('correo')?.touched" class="text-danger mt-1">
            Ingresa un correo electrónico válido.
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-bold">Contraseña</label>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="••••••••">
          <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-danger mt-1">
            La contraseña es obligatoria (mínimo 6 caracteres).
          </div>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
            Entrar
          </button>
        </div>

        <div class="text-center text-muted mt-3">
          ¿No tienes una cuenta? <a routerLink="/registro" class="link-primary">Regístrate aquí</a>
        </div>

      </form>
    </div>
  </div>
</div>
