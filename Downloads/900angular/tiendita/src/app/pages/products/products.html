<div class="p-4">
  <h1 class="text-2xl font-bold mb-4">Tabla de Productos</h1>

  <table class="w-full border">
    <thead>
      <tr>
        <th class="border p-2">ID</th>
        <th class="border p-2">Producto</th>
        <th class="border p-2">Categoría</th>
        <th class="border p-2">Precio</th>
        <th class="border p-2">Stock</th>
        <th class="border p-2">Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let producto of productos">
        <td class="border p-2">{{ producto.id }}</td>
        <td class="border p-2">{{ producto.nombre }}</td>
        <td class="border p-2">{{ producto.categoria }}</td>
        <td class="border p-2">$ {{ producto.precio }}</td>
        <td class="border p-2">{{ producto.stock }}</td>

        <td class="border p-2">
          <button >
            Editar
          </button>

          <button >
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
